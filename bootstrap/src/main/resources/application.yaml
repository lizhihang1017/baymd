server:
  port: 9090
  address: 0.0.0.0
  servlet:
    context-path: /api/baymd

spring:
  application:
    name: baymd${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/baymd?client_encoding=UTF8}
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: BayMDHikariPool

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: baymd-producer${unique-name:}_pg
    send-message-timeout: 2000

milvus:
  uri: ${MILVUS_URI:http://localhost:19530}

# 邮件（主动随访用，默认注释，配置后开启 rag.followup.enabled=true）
spring.mail:
  host: ${MAIL_HOST:smtp.qq.com}
  port: 465
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}    # QQ/163 用授权码
  properties.mail.smtp.ssl.enable: true

rag:
  react:
    enabled: true       # Agent 模式开关
    max-iterations: 5   # ReAct 最大迭代次数

  vector:
    type: pg  # 可选 milvus / pg

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true

  rate-limit:
    global:
      enabled: false
      max-concurrent: 1
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    strategy: sliding_window
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: ${MCP_SERVER_URL:http://localhost:9099}

  report:
    enabled: true            # 报告解读功能默认关闭，配置 VLM 后开启
    max-file-size-mb: 10
    allowed-types: [image/jpeg, image/png, application/pdf]
    bucket: baymd-reports
    scan-detect-min-chars: 50

  followup:
    enabled: false            # 主动随访默认关闭，配置 SMTP 并验证后开启
    scan-delay-ms: 60000
    daily-limit-per-user: 1
    topic-dedup-days: 7
    quiet-hours: "22:00-08:00"
    expire-days: 3
    deep-link-base: http://123.57.135.210:5173
    batch-size: 20
    lock-seconds: 600

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
#    ollama:
#      url: http://localhost:11434
#      endpoints:
#        chat: /v1/chat/completions
#        embedding: /v1/embeddings
    bailian:
      url: https://ws-fdxd5hn6gac5hhhj.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /chat/completions
        embedding: /embeddings
        rerank: /reranks
#    aihubmix:
#      url: https://aihubmix.com
#      api-key: ${AIHUBMIX_API_KEY:}
#      endpoints:
#        chat: /v1/chat/completions
#        embedding: /v1/embeddings
#    siliconflow:
#      url: https://api.siliconflow.cn
#      api-key: ${SILICONFLOW_API_KEY:}
#      endpoints:
#        chat: /v1/chat/completions
#        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3.7-plus
    deep-thinking-model: qwen3.7-plus
    fast-model: qwen-plus-2025-07-28   # 快慢分层：改写/意图等工具性调用走快模型（qwen-mt-flash 不支持 system 角色，勿用）
    candidates:
      - id: qwen3.7-plus
        provider: bailian
        model: qwen3.7-plus
        priority: 1
        supports-thinking: true
      - id: qwen-plus-2025-07-28
        provider: bailian
        model: qwen-plus-2025-07-28
        priority: 2

  embedding:
    default-model: text-embedding-v4
    candidates:
      - id: text-embedding-v4
        provider: bailian
        model: text-embedding-v4
        priority: 1
#      - id: qwen-emb-local
#        provider: ollama
#        model: qwen3-embedding:8b-fp16
#        dimension: ${rag.default.dimension}
#        priority: 2
#      - id: text-embedding-3-large
#        provider: aihubmix
#        model: text-embedding-3-large
#        dimension: ${rag.default.dimension}
#        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      # MaaS 端点无 /reranks（404），真实 rerank 失败后自动降级到 noop（不精排，仅 RRF 融合排序）
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  # 视觉（多模态）模型 — 报告解读图片/扫描件解析用，默认注释（配置后启用）
  vision:
     default-model: qwen3-vl-30b-a3b-thinking
     candidates:
       - id: qwen3-vl-30b-a3b-thinking
         provider: bailian
         model: qwen3-vl-30b-a3b-thinking
         priority: 1

rustfs:
  url: ${RUSTFS_URL:http://localhost:9000}
  access-key-id: ${S3_ACCESS_KEY:admin}
  secret-access-key: ${S3_SECRET_KEY:admin}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key-id: ${S3_ACCESS_KEY:admin}
    secret-access-key: ${S3_SECRET_KEY:admin}

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
  eval:
    enabled: true
